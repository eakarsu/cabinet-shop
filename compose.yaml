services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cabinet_shop
      POSTGRES_USER: cabinet_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cabinet_app -d cabinet_shop"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - cabinet_postgres:/var/lib/postgresql/data
  migrate:
    build:
      context: .
      target: build
    command: ["npx", "prisma", "migrate", "deploy"]
    environment: &app-env
      DATABASE_URL: postgresql://cabinet_app:${POSTGRES_PASSWORD}@database:5432/cabinet_shop?schema=public
      NEXTAUTH_URL: ${NEXTAUTH_URL:?set NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN}
      PRIVACY_HASH_SECRET: ${PRIVACY_HASH_SECRET:?set PRIVACY_HASH_SECRET}
    depends_on:
      database:
        condition: service_healthy
  app:
    build: .
    environment: *app-env
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  cabinet_postgres:
